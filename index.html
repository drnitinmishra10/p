<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मंत्र जाप रहस्य</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* आध्यात्मिक एवं जीवंत रंग पैलेट (Vibrant & Spiritual Palette) */
            --primary: #ff6f00;         /* गहरा सिंदूरी/नारंगी (Deep Saffron) */
            --primary-hover: #e65100;   /* डार्क ऑरेंज */
            --secondary: #d48100;       /* स्वर्णिम आभा (Golden Amber) */
            --accent: #ffd700;          /* चमकदार सोना (Radiant Gold) */
            --bg-dark: #1a0933;         /* गहरा आध्यात्मिक बैंगनी (Mystic Deep Purple) */
            --bg-card: rgba(255, 111, 0, 0.07); /* कार्ड के लिए पारदर्शी नारंगी रंग */
            --border: rgba(255, 215, 0, 0.2);   /* स्वर्णिम बॉर्डर */
            --text: #fff3e0;            /* हल्का गर्म सफेद रंग */
            --text-muted: #ffcc80;      /* हल्का नारंगी/सोना म्यूटेड टेक्स्ट */
            --success: #00e676;
            --error: #ff1744;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #3e103f 40%, #5d1622 75%, #1a0933 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 111, 0, 0.3) 0%, transparent 70%);
            opacity: 0.3;
            pointer-events: none;
            border-radius: 50%;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 10%, #ffe082 40%, var(--primary) 70%, #ff1744 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.01em;
            text-shadow: 0 4px 20px rgba(255, 111, 0, 0.3);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            max-width: 600px;
            margin: 0 auto 30px;
            font-weight: 500;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .stat {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(255, 111, 0, 0.1);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Search & Filter */
        .controls {
            max-width: 600px;
            margin: 0 auto 40px;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 16px 24px 16px 50px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(26, 9, 51, 0.6);
            backdrop-filter: blur(10px);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 111, 0, 0.3);
        }

        .search-box::placeholder {
            color: #b0bec5;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            opacity: 0.4;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.02);
            background: rgba(255, 111, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 20px 40px rgba(255, 111, 0, 0.2);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(255, 111, 0, 0.4);
        }

        .card h2 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--accent);
            word-break: break-word;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .card p {
            color: #eceff1;
            line-height: 1.6;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            flex: 1;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 111, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 111, 0, 0.5);
            filter: brightness(1.2);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            flex: 0 0 auto;
            padding: 12px;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: none;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        .empty-state p {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto;
        }

        /* Error State */
        .error-state {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .error-state h3 {
            color: var(--error);
            margin-bottom: 10px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Mobile Optimization */
        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            header {
                padding: 40px 10px 30px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .card {
                padding: 20px;
            }

            .stats {
                gap: 15px;
            }

            .stat {
                padding: 10px 16px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 111, 0, 0.4);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">

    <header>
        <h1>मंत्र जाप रहस्य</h1>
        <p class="subtitle">
         आध्यात्मिक तरंगों एवं प्रामाणिक मंत्रों का दिव्य संकलन
        </p>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="paperCount">0</div>
                <div class="stat-label">मंत्र संकलन</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="fileCount">0</div>
                <div class="stat-label">HTML फाइलें</div>
            </div>
        </div>
    </header>

    <div class="controls">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" class="search-box" id="searchInput" placeholder="मंत्र या फाइल का नाम खोजें..." autocomplete="off">
    </div>

    <div class="grid" id="papersGrid">
        <div class="loading">
            <div class="spinner"></div>
            <p>दिव्य मंत्रों और शोध की खोज जारी है...</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 डॉ. नितिन मिश्रा | आध्यात्मिक शोध संकलन</p>
        <p style="margin-top: 8px; font-size: 0.9rem;">
            रिपोजिटरी में मौजूद सभी HTML फाइलों को स्वचालित रूप से सूचीबद्ध करता है
        </p>
    </footer>

</div>

<script>
    const papersGrid = document.getElementById('papersGrid');
    const searchInput = document.getElementById('searchInput');
    const paperCountEl = document.getElementById('paperCount');
    const fileCountEl = document.getElementById('fileCount');

    let allPapers = [];

    // 1. HTML कंटेंट से वास्तविक <title> निकालना
    async function getPageTitle(url) {
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 4000);
            
            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(timeout);
            
            if (!response.ok) return null;
            
            const html = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            const title = doc.querySelector('title');
            return title ? title.textContent.trim() : null;
        } catch (error) {
            return null;
        }
    }

    // 2. व्यापक डायरेक्टरी स्कैनिंग (सर्वर और लोकल होस्ट इंडेक्स के लिए)
    // यह सर्वर इंडेक्स से बिना किसी नाम की पाबंदी के हर .html फ़ाइल को ढूँढता है
    async function fetchDirectoryListing() {
        try {
            const response = await fetch('./');
            if (!response.ok) return [];
            
            const html = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            const links = doc.querySelectorAll('a[href]');
            const htmlFiles = [];
            
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href && (href.endsWith('.html') || href.endsWith('.htm')) && 
                    href !== 'index.html' && !href.startsWith('http') && !href.startsWith('//')) {
                    
                    const decodedName = decodeURIComponent(href);
                    htmlFiles.push({
                        name: decodedName.replace(/\.html?/, '').replace(/-/g, ' ').replace(/_/g, ' '),
                        file: href,
                        title: null
                    });
                }
            });
            
            return htmlFiles;
        } catch (e) {
            return [];
        }
    }

    // 3. यदि रिपोजिटरी GitHub Pages पर है, तो पूरे रिपो की सूची बिना नाम की पाबंदी के मंगाना
    async function fetchGitHubFiles() {
        const hostname = window.location.hostname;
        if (!hostname.includes('github.io')) return [];
        
        const username = hostname.split('.')[0];
        const repoName = window.location.pathname.split('/')[1] || `${username}.github.io`;
        
        try {
            const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/`;
            const response = await fetch(apiUrl);
            if (!response.ok) return [];
            
            const data = await response.json();
            return data
                .filter(item => (item.name.endsWith('.html') || item.name.endsWith('.htm')) && item.name !== 'index.html')
                .map(item => ({
                    name: decodeURIComponent(item.name).replace(/\.html?/, '').replace(/-/g, ' ').replace(/_/g, ' '),
                    file: item.name,
                    title: null
                }));
        } catch (e) {
            return [];
        }
    }

    // 4. बैकअप हाइब्रिड प्रोबिंग (यदि सर्वर इंडेक्सिंग सुरक्षा कारणों से बंद हो)
    async function probeForFiles() {
        const found = [];
        const checks = [];
        
        // सीरीज़ आधारित नाम चेकिंग की रेंज बढ़ा दी गई है (c1 से c30, paper1 से paper20)
        for (let i = 1; i <= 30; i++) {
            checks.push(`c${i}.html`);
            checks.push(`paper${i}.html`);
            checks.push(`mantra${i}.html`);
        }
        
        const extraNames = ['about.html', 'contact.html', 'research.html', 'vashikaran.html', 'index(3).html'];
        const allChecks = [...checks, ...extraNames];

        const batchSize = 10;
        for (let i = 0; i < allChecks.length; i += batchSize) {
            const batch = allChecks.slice(i, i + batchSize);
            const promises = batch.map(file => checkFileExists(file));
            const results = await Promise.all(promises);
            
            results.forEach(res => {
                if (res.exists) {
                    found.push({
                        name: decodeURIComponent(res.url).replace(/\.html?/, '').replace(/-/g, ' ').replace(/_/g, ' '),
                        file: res.url,
                        title: null
                    });
                }
            });
        }
        
        return found;
    }

    async function checkFileExists(url) {
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 2000);
            const response = await fetch(url, { method: 'HEAD', signal: controller.signal });
            clearTimeout(timeout);
            return { exists: response.ok, url };
        } catch (error) {
            return { exists: false, url };
        }
    }

    function formatTitle(name) {
        return name
            .split(' ')
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(' ');
    }

    function getPaperIcon(name) {
        const icons = ['🔱', '🕉️', '✨', '📖', '🧘', '🌸', '☀️', '🔮', '💡', '📝'];
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return icons[Math.abs(hash) % icons.length];
    }

    // मुख्य रेंडरर फंक्शन
    async function renderPapers(papers) {
        papersGrid.innerHTML = '';
        
        if (papers.length === 0) {
            papersGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📂</div>
                    <h3>कोई फ़ाइल नहीं मिली</h3>
                    <p>डायरेक्टरी स्कैन में कोई भी .html फ़ाइल नहीं मिल सकी। प्रदर्शित करने के लिए फाइलें इसी फोल्डर में जोड़ें।</p>
                </div>
            `;
            paperCountEl.textContent = '0';
            fileCountEl.textContent = '0';
            return;
        }

        paperCountEl.textContent = papers.length;
        fileCountEl.textContent = papers.length;

        // यूज़र इंटरफ़ेस को तेज़ रखने के लिए पहले बिना टाइटल्स के तुरंत रेंडर करें
        papers.forEach((paper, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${index}`;
            card.style.animationDelay = `${index * 0.03}s`;
            
            const displayTitle = formatTitle(paper.name);
            const icon = getPaperIcon(paper.name);
            
            card.innerHTML = `
                <div class="card-icon">${icon}</div>
                <h2 class="title-text">${displayTitle}</h2>
                <div class="card-meta">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span>${paper.file}</span>
                </div>
                <p class="desc-text">${displayTitle}</p>
                <div class="card-footer">
                    <a class="btn" href="${paper.file}" target="_blank" rel="noopener noreferrer">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        खोलें (Open)
                    </a>
                    <a class="btn btn-secondary" href="${paper.file}" download title="Download">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </a>
                </div>
            `;
            papersGrid.appendChild(card);
        });

        // बैकग्राउंड में एसिंक्रोनस रूप से <title> लोड करके यूआई को रियल-टाइम अपडेट करना
        allPapers = [...papers];
        papers.forEach(async (paper, index) => {
            const realTitle = await getPageTitle(paper.file);
            if (realTitle) {
                allPapers[index].title = realTitle;
                const cardEl = document.getElementById(`card-${index}`);
                if (cardEl) {
                    cardEl.querySelector('.title-text').textContent = realTitle;
                    cardEl.querySelector('.desc-text').textContent = realTitle;
                }
            } else {
                allPapers[index].title = formatTitle(paper.name);
            }
        });
    }

    // लाइव सर्च / फ़िल्टर फ़ंक्शन
    function filterPapers(query) {
        const filtered = allPapers.filter(paper => 
            (paper.title && paper.title.toLowerCase().includes(query.toLowerCase())) ||
            paper.name.toLowerCase().includes(query.toLowerCase()) ||
            paper.file.toLowerCase().includes(query.toLowerCase())
        );
        
        papersGrid.innerHTML = '';
        
        if (filtered.length === 0) {
            papersGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <h3>कोई परिणाम नहीं मिला</h3>
                    <p>आपके खोज शब्द से मेल खाती कोई फ़ाइल नहीं मिली।</p>
                </div>
            `;
            return;
        }

        filtered.forEach((paper, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            const displayTitle = paper.title || formatTitle(paper.name);
            const icon = getPaperIcon(paper.name);
            
            card.innerHTML = `
                <div class="card-icon">${icon}</div>
                <h2>${displayTitle}</h2>
                <div class="card-meta">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span>${paper.file}</span>
                </div>
                <p>${displayTitle}</p>
                <div class="card-footer">
                    <a class="btn" href="${paper.file}" target="_blank" rel="noopener noreferrer">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        खोलें (Open)
                    </a>
                    <a class="btn btn-secondary" href="${paper.file}" download title="Download">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </a>
                </div>
            `;
            papersGrid.appendChild(card);
        });
    }

    // लोडिंग आर्किटेक्चर (Sequential Execution Pipeline)
    async function loadPapers() {
        // स्ट्रेटेजी 1: डायरेक्टरी रूट स्कैन (नामों की पाबंदी के बिना)
        let papers = await fetchDirectoryListing();
        
        // स्ट्रेटेजी 2: यदि लाइव सर्वर इंडेक्स खाली है, तो GitHub Pages API चेक करें
        if (papers.length === 0) {
            papers = await fetchGitHubFiles();
        }
        
        // स्ट्रेटेजी 3: बैकअप के लिए व्यापक रेंज हाइब्रिड प्रोबिंग
        if (papers.length === 0) {
            papers = await probeForFiles();
        }
        
        // डुप्लिकेट हटाना
        const seen = new Set();
        papers = papers.filter(paper => {
            if (seen.has(paper.file)) return false;
            seen.add(paper.file);
            return true;
        });
        
        // वर्णानुक्रम (Alphabetical order) में लगाना
        papers.sort((a, b) => a.file.localeCompare(b.file));
        
        await renderPapers(papers);
    }

    // सर्च बॉक्स ट्रिगर
    searchInput.addEventListener('input', (e) => {
        filterPapers(e.target.value);
    });

    // इनिशियलाइज़ेशन
    loadPapers();
</script>
